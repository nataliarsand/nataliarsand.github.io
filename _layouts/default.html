<!DOCTYPE html>
<html lang="en">
{% include sections/meta-head.html %}
<body class="default-theme">
    <a href="#main-content-start" class="skip-link">Skip to main content</a>
    {% include sections/header.html %}

    <main id="{{ page.main_id | default: 'home' }}">
        <div id="main-content-start"></div>
        {{ content }}
    </main>

    {% include sections/footer.html %}
    
    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
        <button class="modal-nav modal-prev" id="modalPrev" aria-label="Previous image">‹</button>
        <button class="modal-nav modal-next" id="modalNext" aria-label="Next image">›</button>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>
    
    <script src="{{ '/assets/script.js' | relative_url }}"></script>

    <!-- Hello, curious mind. I see you like peeking under the hood. We'd probably get along. -->
</body>
</html>
