# ----------------------------------------------------
# Site Settings
# ----------------------------------------------------
title: Natalia Arsand,  UX Lead Designer
email: contact@nataliarsand.com
description: >-
  Portfolio of Natalia Arsand – UX design leader and systems thinker.
  Projects, case studies, and experiments across different domains, technologies, and industries.
url: "https://nataliarsand.github.io"
baseurl: ""

# Social
twitter_username: nataliarsand
github_username: nataliarsand
linkedin_username: nataliaarsand

# ----------------------------------------------------
# Build Settings
# ----------------------------------------------------
# theme: minima
destination: docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Markdown processing
markdown: kramdown
kramdown:
  input: GFM

# Permalinks
permalink: pretty

# ----------------------------------------------------
# Collections
# ----------------------------------------------------
collections:
  works:
    output: true
    permalink: /works/:name/

# ----------------------------------------------------
# Exclude/Include Paths
# ----------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .jekyll-cache/
  - .sass-cache/
  - README.md
  - yarn.lock
  - package.json
  - package-lock.json

include:
  - _redirects
  - robots.txt

# ----------------------------------------------------
# Defaults
# ----------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: work
      author: Natalia Arsand

# ----------------------------------------------------
# Custom Variables
# ----------------------------------------------------
footer_text: "© 2025 Natalia Arsand. All rights reserved."
