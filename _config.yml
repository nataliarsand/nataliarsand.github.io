# ----------------------------------------------------
# 🔧 Site Settings
# ----------------------------------------------------
title: Natalia Arsand,  UX Designer & Conscious Creator
email: contact@nataliarsand.com
description: >-
  Portfolio of Natalia Arsand – UX design leader, systems thinker, and conscious living advocate.
  Projects, case studies, and experiments across tech, wellness, and design systems.
url: "https://nataliarsand.github.io"
baseurl: "/portfolio.io"

# Social (used in meta tags and templates)
twitter_username: nataliarsand
github_username: nataliarsand
linkedin_username: nataliaarsand

# ----------------------------------------------------
# 🚀 Build Settings
# ----------------------------------------------------
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Markdown processing
markdown: kramdown
kramdown:
  input: GFM

# Permalinks
permalink: pretty

# ----------------------------------------------------
# 📂 Collections
# ----------------------------------------------------
collections:
  works:
    output: true
    permalink: /works/:name/

# ----------------------------------------------------
# 🧼 Exclude/Include Paths
# ----------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .jekyll-cache/
  - .sass-cache/
  - README.md
  - yarn.lock
  - package.json
  - package-lock.json
  - assets/main.scss

include:
  - _redirects

# ----------------------------------------------------
# 🌐 Defaults (Optional - helps if you later group content)
# ----------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "works"
    values:
      layout: work
      author: Natalia Arsand

# ----------------------------------------------------
# 🔮 Custom Variables (add as needed)
# ----------------------------------------------------
footer_text: "© 2025 Natalia Arsand. All rights reserved."
