<button type="button" class="folder-link" data-href="{{ include.url }}">
  <span class="folder-inner">
    <img src="{{ include.image | default: '/assets/images/folder.png' }}" alt="" class="folder-icon" aria-hidden="true">
    <span class="folder-title">{{ include.title }}{% if include.protected %}<i class="fa-solid fa-lock protected-icon" aria-label="Password protected"></i>{% endif %}</span>
  </span>
</button>
