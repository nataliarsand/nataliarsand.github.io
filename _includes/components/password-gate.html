<!-- Password Gate Overlay -->
<!-- Yes, you found it. If you can read it, well done. But maybe drop me a message anyway? -->
<div class="password-gate" id="passwordGate">
    <div class="password-gate-content">
        <i class="fa-solid fa-lock password-gate-icon"></i>
        <h2>This case study is protected</h2>
        <p>Enter the password to view this work.</p>
        <div class="password-form">
            <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off" />
            <button type="button" id="unlockBtn">Unlock</button>
        </div>
        <p class="password-error" id="passwordError">Incorrect password. Try again.</p>
        <p class="password-hint">Don't have the password? <a href="mailto:{{ site.contact_email }}?subject=Portfolio%20Access%20Request">Request access</a></p>
    </div>
</div>
